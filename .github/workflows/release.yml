name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: jmux-linux-amd64
          path: |
            target/release/jmux-app
            target/release/jmux-cli

  build-daemon:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: daemon/remote/go.mod

      - name: Cross-compile jmuxd-remote for all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          LDFLAGS="-X main.version=${VERSION}"
          cd daemon/remote
          for TARGET in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}" CGO_ENABLED=0 \
              go build -ldflags "${LDFLAGS}" -o "../../artifacts/jmuxd-remote-${TARGET}" \
              ./cmd/jmuxd-remote
          done
          cd ../../artifacts
          sha256sum jmuxd-remote-* > checksums-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jmuxd-remote-binaries
          path: artifacts/

  release:
    needs: [build, build-daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jmux-linux-amd64
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: jmuxd-remote-binaries
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x artifacts/jmux-app artifacts/jmux-cli artifacts/jmuxd-remote-*
          # Upload to existing release if it was created manually, otherwise create new
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" artifacts/jmux-app artifacts/jmux-cli \
              artifacts/jmuxd-remote-* artifacts/checksums-sha256.txt --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details." \
              artifacts/jmux-app \
              artifacts/jmux-cli \
              artifacts/jmuxd-remote-* \
              artifacts/checksums-sha256.txt
          fi

